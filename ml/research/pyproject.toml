[project]
name = "copydet-research"
version = "0.1.0"
description = "Image copy detection for IdeaFusion: datasets, baselines, training, evaluation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "augly>=1.0.0",
    "pillow>=10.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "imagehash>=4.3",
    "pyyaml>=6",
    "tqdm>=4.66",
    "requests>=2.31",
    "matplotlib>=3.8",
    # AugLy imports `magic`; plain python-magic hangs on Windows without libmagic,
    # python-magic-bin ships the DLL under the same module name.
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Stages 2-4 (embeddings, training, keypoints). Kept separate so stage 1 installs fast.
models = [
    "torch>=2.4",
    "torchvision>=0.19",
    "open-clip-torch>=2.24",
    "faiss-cpu>=1.8",
    "opencv-python-headless>=4.9",
    "scikit-learn>=1.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
default-groups = ["dev"]
override-dependencies = ["python-magic>=0.4.27; sys_platform != 'win32'"]

# CPU wheels of torch: no NVIDIA GPU on the dev machine; GPU training runs in Colab/Kaggle.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copydet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
