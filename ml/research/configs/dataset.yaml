# Main copy-detection dataset for illustrations (chapter 1, table 1.3, "own dataset").
# Paths are relative to ml/research.
name: artbench_v1
catalog: data/manifests/catalog.parquet
output_dir: data/processed/artbench_v1
seed: 42

n_originals: 1500
split_ratios: {train: 0.6, val: 0.2, test: 0.2}   # split BY ARTIST

min_works_per_artist: 4        # artist needs originals + at least one hard negative
max_originals_per_artist: 5    # many artists, few works each -> less style memorisation
hard_negatives_per_artist: 5   # other works of the same artist: must NOT match
same_style_negatives: 300      # per val/test; only when the catalog has style labels (wikiart)
n_distractors: 1000            # collage backgrounds + index noise

train_queries_per_original: 6  # random trainable types per train original
held_out_types: [collage, screenshot]   # test only

max_side: 1024
jpeg_quality: 95
near_dup_hamming: 6            # pHash distance under which two works count as the same work
workers: 0                     # 0 = min(8, cpu_count - 1)
