[project]
name = "copydet-service"
version = "1.0.0"
description = "IdeaFusion image copy detection service (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    "numpy>=1.26",
    "pillow>=10.1",
    "imagehash>=4.3",
    "opencv-python-headless>=4.9",
    "torch>=2.4",
    "torchvision>=0.19",
    "scikit-learn>=1.4",
    "joblib>=1.4",
    "tqdm>=4.66",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pgvector>=0.3",
    "minio>=7.2",
]

[project.optional-dependencies]
# Only when the deployed fusion model uses CLIP features (see models/<version>/thresholds.json).
clip = ["open-clip-torch>=2.24"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "pyarrow>=15"]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# The research package is the single source of the pipeline code: the service imports the
# exact preprocessing, hashing, keypoint matching and fusion code the model was evaluated with.
[tool.hatch.build.targets.wheel.force-include]
"../research/src/copydet" = "copydet"

[tool.pytest.ini_options]
testpaths = ["tests"]
